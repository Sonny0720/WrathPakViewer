
name: Build Wrath PAK Viewer

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install texture verification dependency
        run: python3 -m pip install Pillow

      - name: Verify geometry, texture and export decoders
        run: |
          python3 -m compileall -q research
          python3 -m unittest discover -s research/tests -v

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WrathPakViewer-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile desktop and shared decoders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/classes, out/input
          $shared = 'app/src/main/java/com/wrath/pakviewer'
          javac -encoding UTF-8 --release 17 -d out/classes "$shared/WrathGeometry.java" "$shared/WrathTextures.java" "$shared/WrathMotion.java" "$shared/WrathExports.java" desktop/src/main/java/com/wrath/pakviewer/DesktopApp.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          jar --create --file out/input/WrathPakViewer.jar --main-class com.wrath.pakviewer.DesktopApp -C out/classes .
      - name: Package portable Windows app
        shell: pwsh
        run: |
          jpackage --type app-image --name WrathPakViewer --app-version 2.4 --input out/input --main-jar WrathPakViewer.jar --dest out/package --add-modules java.desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = 'out/package/WrathPakViewer'
          $pak = [byte[]]::new(28)
          [BitConverter]::GetBytes([int]0x52049).CopyTo($pak, 0)
          [IO.File]::WriteAllBytes("$PWD/out/smoke.pak", $pak)
          Start-Process -FilePath "$app/WrathPakViewer.exe" -ArgumentList "`"$PWD/out/smoke.pak`"", 'textures', "`"$PWD/out/smoke.zip`"" -Wait
          if (!(Test-Path out/smoke.zip)) { throw 'The packaged launcher did not create a ZIP.' }
          Expand-Archive out/smoke.zip out/smoke
          if (!(Test-Path out/smoke/textures/index.csv)) { throw 'The packaged launcher ZIP is missing its texture index.' }
          Compress-Archive -Path $app -DestinationPath out/WrathPakViewer_v2_4_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WrathPakViewer-Windows-x64
          path: out/WrathPakViewer_v2_4_Windows_x64.zip
          if-no-files-found: error
